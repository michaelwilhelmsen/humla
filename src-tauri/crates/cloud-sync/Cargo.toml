[package]
name = "cloud-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "PocketBase-backed sync engine for Humla. Framework-agnostic."
license = "MIT"

[dependencies]
# rusqlite MUST match the public humla core (0.32) so the
# Arc<Mutex<rusqlite::Connection>> handed across the seam unifies to the same
# concrete type. Do not bump independently of the core.
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
anyhow = "1"
# Only for parsing a session manifest's RFC3339 `started_at` into the epoch-ms
# the note_sessions contract expects. std-only, no clock backend needed.
chrono = { version = "0.4", default-features = false, features = ["std"] }
